name: Liberacion del Sistema de Inventario

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  liberar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ejecutar pruebas
        run: node --test "tests/*.test.js"

      - name: Crear paquete
        run: zip -r "sistema-inventario-${GITHUB_REF_NAME}.zip" src/

      - name: Extraer notas del CHANGELOG
        run: |
          awk -v encabezado="## ${GITHUB_REF_NAME}" '
            $0 == encabezado { dentro = 1; next }
            /^## / { dentro = 0 }
            dentro
          ' CHANGELOG.md > notas.md
          cat notas.md

      - name: Publicar version
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} - Sistema de Inventario
          body_path: notas.md
          files: sistema-inventario-${{ github.ref_name }}.zip
          generate_release_notes: true
