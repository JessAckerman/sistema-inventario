name: Pruebas

on:
  push:
    branches:
      - main
      - "test/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ejecutar las pruebas
        run: node --test "tests/*.test.js"
